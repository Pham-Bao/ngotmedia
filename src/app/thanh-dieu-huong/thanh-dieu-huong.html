<header class="thanh-header" [class.trong-suot]="trongSuot()">
  <div class="wrap thanh">
    <a class="logo" routerLink="/">
      <span class="logo-hop">
        <img src="/logo/FILE NGOT XOAN copyq.png" alt="Ngọt Media" />
      </span>
      <b>Ngọt Media</b>
    </a>

    <nav class="menu-desktop">
      @for (muc of danhSachMuc; track muc.duongDan) {
        <a
          [routerLink]="muc.duongDan"
          routerLinkActive="dang-chon"
          [routerLinkActiveOptions]="{ exact: muc.duongDan === '/' }"
        >
          {{ muc.nhan }}
        </a>
      }
      <a class="btn btn-primary btn-sm" href="#">Đặt lịch</a>
    </nav>

    <button type="button" class="nut-menu" (click)="moMenu()" aria-label="Mở menu">
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<div class="menu-mobile" [class.mo]="menuDangMo()">
  <div class="dau-menu-mobile">
    <a class="logo" routerLink="/" (click)="dongMenu()">
      <span class="logo-hop">
        <img src="/logo/FILE NGOT XOAN copyq.png" alt="Ngọt Media" />
      </span>
      <b>Ngọt Media</b>
    </a>
    <button type="button" class="nut-dong" (click)="dongMenu()" aria-label="Đóng menu">✕</button>
  </div>
  <nav class="lien-ket-menu-mobile">
    @for (muc of danhSachMuc; track muc.duongDan) {
      <a [routerLink]="muc.duongDan" routerLinkActive="dang-chon" (click)="dongMenu()">{{
        muc.nhan
      }}</a>
    }
  </nav>
  <a class="btn btn-primary" href="#" (click)="dongMenu()">Đặt lịch chụp</a>
</div>
